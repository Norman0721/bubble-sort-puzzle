<section id="bb-home" hidden aria-label="泡泡解谜游戏首页。拖动瞄准并发射，清除泡泡。">
  <div id="bb-home-frame">
    <div class="bh-background" aria-hidden="true"></div>
    <h1 class="bh-logo" id="bh-title">泡泡解谜</h1>
    <div class="bh-bubbles" aria-hidden="true"><span class="bh-bubble red"></span><span class="bh-bubble blue"></span><span class="bh-bubble green"></span><span class="bh-bubble yellow"></span></div>
    <nav class="bh-buttons" aria-label="游戏入口">
      <button id="bh-primary" class="bh-button bh-primary" disabled>开始游戏</button>
      <button id="bh-levels" class="bh-button" disabled>选择关卡</button>
      <span id="bh-editor-slot"></span>
    </nav>
    <p id="bh-perfect" hidden></p>
    <div id="bh-loading" role="status"><span class="bh-spinner" aria-hidden="true"></span><span>正在准备泡泡…</span></div>
    <div id="bh-error" hidden role="status"><span id="bh-error-text"></span><button id="bh-retry">重试</button></div>
  </div>
  <p id="bh-rotate" hidden>请旋转设备，竖屏体验更佳</p>
</section>
